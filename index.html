<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santoral Diario</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #d97706;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      padding: 32px;
      border: 1px solid var(--border);
    }

    h1 {
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      margin: 16px 0 24px 0;
      border-radius: 8px;
    }

    .intro {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .cuerpo {
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .cierre {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Santoral del Día</h1>
    
    <!-- Reproduce siempre el audio actualizado del día -->
    <audio controls autoplay src="santoral-hoy.mp3"></audio>

    <p class="intro">Cargando la emisión de hoy...</p>
    <div class="cuerpo">El contenido se actualizará automáticamente a las 03:00 UTC.</div>
    <p class="cierre">Que tengan una excelente jornada.</p>
  </div>

</body>
</html>
